services:
  schniffer:
    build: .
    container_name: schniffer-bot
    # Chrome inside the container needs real shared memory for renderer + GPU
    # buffers. Default /dev/shm is 64 MB which causes Chrome to die after a
    # handful of navigations and break the booking pool until restart.
    shm_size: 2gb
    # Cap memory so a runaway Chrome pool can't OOM the rest of the host.
    # Generous on a 16 GB box — far more than the pool needs in practice.
    mem_limit: 6g
    memswap_limit: 6g
    env_file:
      - ${SCHNIFFER_ENV:-.env}
    environment:
      - PROD=true
      - DB_PATH=/app/data/schniffer.sqlite
      - BOOKER_PROFILE_DIR=/app/.cache/recgov-profiles
    volumes:
      - ${SCHNIFFER_DATA:-./data}:/app/data
      # Persist Chrome user-data-dirs across deploys. The r1s-fingerprint
      # cookie and warmed JWT survive only if this is a host bind, NOT an
      # in-image directory (which is wiped on every --build).
      - ${SCHNIFFER_PROFILES:-./profiles}:/app/.cache/recgov-profiles
    restart: unless-stopped
    ports:
      - "8069:8069"
      - "9090:9090"
    networks:
      - default
      - home_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # metrics-init makes prom + grafana persist alongside schniffer.sqlite under
  # ${SCHNIFFER_DATA}/. Docker auto-creates bind-mount host paths as root,
  # but Prometheus runs as UID 65534 and Grafana as 472 — without this fixup
  # the containers crashloop on first boot of a fresh deploy. Idempotent;
  # re-runs on every `up`. Backing up ${SCHNIFFER_DATA} covers metrics too.
  metrics-init:
    image: alpine:3.20
    container_name: schniffer-metrics-init
    command: >
      sh -c "
        mkdir -p /data/prometheus /data/grafana &&
        chown -R 65534:65534 /data/prometheus &&
        chown -R 472:472 /data/grafana
      "
    volumes:
      - ${SCHNIFFER_DATA:-./data}:/data
    restart: "no"
    networks:
      - default

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: schniffer-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - ${SCHNIFFER_DATA:-./data}/prometheus:/prometheus
    ports:
      - "9091:9090"
    restart: unless-stopped
    depends_on:
      schniffer:
        condition: service_started
      metrics-init:
        condition: service_completed_successfully
    networks:
      - default

  grafana:
    image: grafana/grafana:11.3.0
    container_name: schniffer-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${SCHNIFFER_DATA:-./data}/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      metrics-init:
        condition: service_completed_successfully
    networks:
      - default

networks:
  home_default:
    external: true
